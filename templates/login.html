{% extends "base.html" %}
{% block title %}Login — DAOYOU{% endblock %}
{% block content %}
<section class="container auth-wrap"><form class="form-card" method="post">
  <div class="eyebrow">WELCOME BACK</div><h1>Login</h1>
  <label>Email<input name="email" type="email" required></label>
  <label>Password<input name="password" type="password" required></label>
  <button class="btn full">Login</button>
  <p>No account? <a href="{{ url_for('register') }}">Create one</a></p>
</form></section>
{% endblock %}
